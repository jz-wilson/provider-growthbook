apiVersion: core.growthbook.crossplane.io/v1alpha1
kind: Project
metadata:
  name: web
  namespace: default
spec:
  forProvider:
    name: Web
    description: Managed by Crossplane
    # publicId is optional; GrowthBook derives one from name and the
    # controller late-initializes it here.
    settings:
      statsEngine: bayesian
      confidenceLevel: "0.95"
  # initProvider:
  #   # Applied only when the project is first created; later drift in
  #   # these fields against the GrowthBook API is ignored. Pair with a
  #   # managementPolicies value that omits LateInitialize.
  #   description: Managed by Crossplane
  #   publicId: web
  providerConfigRef:
    kind: ProviderConfig
    name: example
