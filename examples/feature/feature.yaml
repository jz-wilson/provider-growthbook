apiVersion: feature.growthbook.crossplane.io/v1alpha1
kind: Feature
metadata:
  name: new-checkout-flow
  namespace: default
  # The feature key is the external name; it defaults to metadata.name.
  # Set the annotation to use a different key:
  # annotations:
  #   crossplane.io/external-name: new_checkout_flow
spec:
  forProvider:
    valueType: boolean
    defaultValue: "true"
    description: Enables the redesigned checkout flow
    # project: prj_abc123
    tags:
      - checkout
      - experiment
    archived: false
    # owner: alice@example.com
    environments:
      production:
        enabled: false
      staging:
        enabled: true
    # Rules is opt-in: leave it unset (as above) to leave any rules
    # configured out of band (e.g. through the GrowthBook UI) untouched.
    # Setting it, even to an empty list, is authoritative and replaces
    # the feature's entire rules array.
    # rules:
    #   # A force rule serves a fixed value to matching users.
    #   - type: force
    #     description: Force on for US users
    #     condition: '{"country":"US"}'
    #     allEnvironments: true
    #     value: "true"
    #   # A rollout rule serves a value to a percentage of matching users,
    #   # hashed on the given attribute for consistent assignment.
    #   - type: rollout
    #     description: 25% rollout by user id
    #     allEnvironments: true
    #     value: "true"
    #     coverage: "0.25"
    #     hashAttribute: id
  # initProvider:
  #   # Applied only when the feature is first created; later drift in
  #   # these fields (including rules) against the GrowthBook API is
  #   # ignored. Pair with a managementPolicies value that omits
  #   # LateInitialize.
  #   description: Enables the redesigned checkout flow
  #   rules:
  #     - type: force
  #       allEnvironments: true
  #       value: "true"
  providerConfigRef:
    kind: ProviderConfig
    name: example
