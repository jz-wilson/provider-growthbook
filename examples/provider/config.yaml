apiVersion: v1
kind: Namespace
metadata:
  name: default
---
# The credentials key holds a JSON document:
#   {"apiKey": "secret_...", "apiUrl": "https://growthbook.example.com/api"}
# apiUrl is optional and defaults to GrowthBook Cloud (https://api.growthbook.io/api).
# A plain-text secret key without JSON also works.
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: growthbook-credentials
type: Opaque
stringData:
  credentials: |
    {"apiKey": "secret_replace_me", "apiUrl": "https://growthbook.example.com/api"}
---
apiVersion: growthbook.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: example
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: growthbook-credentials
      key: credentials
---
apiVersion: growthbook.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: example
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: growthbook-credentials
      key: credentials
