---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: features.feature.growthbook.crossplane.io
spec:
  group: feature.growthbook.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - growthbook
    kind: Feature
    listKind: FeatureList
    plural: features
    singular: feature
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A Feature is a GrowthBook feature flag. This milestone manages its
          value, per-environment enabled toggles, and rules.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A FeatureSpec defines the desired state of a Feature.
            properties:
              forProvider:
                description: |-
                  FeatureParameters are the configurable fields of a GrowthBook Feature.
                  The feature key is the resource's external name (crossplane.io/
                  external-name annotation), defaulting to metadata.name.

                  This milestone covers the feature's value, its per-environment enabled
                  toggles, and its rules (force, rollout, and experiment-ref). Rule
                  prerequisites, revisions, and JSON schema validation are not modeled and
                  are left for a later milestone; a Feature managed here will report
                  ResourceUpToDate based solely on the fields below. When Rules is left
                  nil, rules are unmanaged and any configured out of band (for example
                  through the GrowthBook UI) are left untouched.

                  Deleting a Feature normally issues a plain DELETE. Some organizations
                  disable "REST API always bypasses approval requirements", in which case
                  GrowthBook refuses to delete a live (non-archived) feature via the REST
                  API; the controller detects that response and archives the feature
                  before retrying the delete once.
                properties:
                  archived:
                    description: Archived hides the feature from the default feature
                      list.
                    type: boolean
                  defaultValue:
                    description: |-
                      DefaultValue is the value served when the feature is enabled. Its
                      type must match ValueType; for "number" and "json" the literal is
                      passed through as a string exactly as GrowthBook expects it.
                    type: string
                  description:
                    description: Description is free text shown in the GrowthBook
                      UI.
                    type: string
                  environments:
                    additionalProperties:
                      description: |-
                        FeatureEnvironment is the desired state of a Feature within one
                        environment.
                      properties:
                        enabled:
                          description: Enabled toggles the feature on or off in this
                            environment.
                          type: boolean
                      type: object
                    description: |-
                      Environments maps an environment id to its desired enabled state.
                      Only the environments present here are managed; environments left
                      out are never touched.
                    type: object
                  owner:
                    description: Owner is the userId or email address of the feature's
                      owner.
                    type: string
                  project:
                    description: Project restricts the feature to one project id.
                    type: string
                  rules:
                    description: |-
                      Rules is the feature's ordered rule list. Nil means rules are
                      unmanaged (left as-is, including any configured out of band); a
                      non-nil list, including an empty one, is authoritative and replaces
                      the feature's entire rules array.
                    items:
                      description: |-
                        FeatureRule is one entry in a Feature's rules array. Rules are evaluated
                        in list order; the first matching rule wins. Type-specific fields are
                        only meaningful for the matching Type and are otherwise ignored.

                        Safe-rollout rules are out of scope: they only round-trip via a
                        server-assigned safeRolloutId this provider does not model, so they
                        cannot be authored or reconciled here.
                      properties:
                        allEnvironments:
                          description: |-
                            AllEnvironments, when true, applies this rule in every environment.
                            When false, only the environments listed in Environments receive
                            the rule.
                          type: boolean
                        condition:
                          description: |-
                            Condition is a JSON-encoded targeting condition, passed through to
                            GrowthBook verbatim.
                          type: string
                        coverage:
                          description: |-
                            Coverage is the percentage of matched users to include, as a
                            decimal string between "0" and "1" inclusive (for example "0.25").
                            Applies to the "rollout" type; required when the rollout should
                            serve fewer than 100% of matched users.
                          pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                          type: string
                        description:
                          description: Description is free text shown in the GrowthBook
                            UI.
                          type: string
                        enabled:
                          description: Enabled toggles this rule on or off.
                          type: boolean
                        environments:
                          description: |-
                            Environments lists the environment ids this rule applies to. Used
                            only when AllEnvironments is false.
                          items:
                            type: string
                          type: array
                        experimentId:
                          description: |-
                            ExperimentID links this rule to an existing experiment. Applies to
                            the "experiment-ref" type.
                          type: string
                        hashAttribute:
                          description: |-
                            HashAttribute is the attribute to hash on for consistent user
                            assignment. Applies to (and required by GrowthBook for) the
                            "rollout" type.
                          type: string
                        id:
                          description: |-
                            ID is the server-assigned rule id. Leave empty to let GrowthBook
                            assign one on create; set it (as observed via status.atProvider) to
                            keep updates stable and target a specific existing rule.
                          type: string
                        savedGroups:
                          description: SavedGroups scopes this rule to users in (or
                            not in) saved groups.
                          items:
                            description: |-
                              SavedGroupTargeting scopes a rule to users in (or not in) a set of saved
                              groups.
                            properties:
                              ids:
                                description: IDs are the saved group ids this targeting
                                  entry references.
                                items:
                                  type: string
                                type: array
                              match:
                                description: Match selects how the listed saved groups
                                  are combined.
                                enum:
                                - all
                                - none
                                - any
                                type: string
                            required:
                            - ids
                            - match
                            type: object
                          type: array
                        type:
                          description: Type selects the rule kind.
                          enum:
                          - force
                          - rollout
                          - experiment-ref
                          type: string
                        value:
                          description: |-
                            Value is the value served when this rule matches. Applies to the
                            "force" and "rollout" types.
                          type: string
                        variations:
                          description: |-
                            Variations maps experiment variations to the values this feature
                            serves for each. Applies to the "experiment-ref" type.
                          items:
                            description: |-
                              FeatureRuleVariation maps one experiment variation to the value this
                              feature serves when that variation is assigned.
                            properties:
                              value:
                                description: Value is the feature value served for
                                  this variation.
                                type: string
                              variationId:
                                description: VariationID is the id of the experiment
                                  variation.
                                type: string
                            required:
                            - value
                            - variationId
                            type: object
                          type: array
                      required:
                      - type
                      type: object
                    type: array
                  tags:
                    description: |-
                      Tags are labels associated with the feature. Nil means unmanaged;
                      a set list compares and replaces as a set.
                    items:
                      type: string
                    type: array
                  valueType:
                    description: |-
                      ValueType is the data type of the feature payload. Immutable after
                      creation.
                    enum:
                    - boolean
                    - string
                    - number
                    - json
                    type: string
                required:
                - defaultValue
                - valueType
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A FeatureStatus represents the observed state of a Feature.
            properties:
              atProvider:
                description: FeatureObservation are the observable fields of a GrowthBook
                  Feature.
                properties:
                  dateCreated:
                    description: DateCreated is when GrowthBook created the feature.
                    type: string
                  dateUpdated:
                    description: DateUpdated is when GrowthBook last updated the feature.
                    type: string
                  environments:
                    additionalProperties:
                      description: |-
                        FeatureEnvironmentObservation is the observed state of a Feature within
                        one environment.
                      properties:
                        enabled:
                          description: Enabled reports whether the feature is on in
                            this environment.
                          type: boolean
                      type: object
                    description: Environments reports the observed enabled state per
                      environment.
                    type: object
                  id:
                    description: ID is the feature key as stored by GrowthBook.
                    type: string
                  revision:
                    description: Revision is the feature's current published revision.
                    properties:
                      version:
                        description: Version is the revision number.
                        type: integer
                    type: object
                  rules:
                    description: Rules reports the feature's observed rule list.
                    items:
                      description: |-
                        FeatureRuleObservation reports the observed state of one rule on a
                        Feature.
                      properties:
                        enabled:
                          description: Enabled reports whether the rule is on.
                          type: boolean
                        environments:
                          description: Environments reports the environment ids the
                            rule is scoped to.
                          items:
                            type: string
                          type: array
                        id:
                          description: ID is the server-assigned rule id.
                          type: string
                        type:
                          description: Type is the observed rule kind.
                          type: string
                      type: object
                    type: array
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
