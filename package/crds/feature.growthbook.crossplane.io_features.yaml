---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: features.feature.growthbook.crossplane.io
spec:
  group: feature.growthbook.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - growthbook
    kind: Feature
    listKind: FeatureList
    plural: features
    singular: feature
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A Feature is a GrowthBook feature flag. This milestone manages its
          value and per-environment enabled toggles; rules are not modeled.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A FeatureSpec defines the desired state of a Feature.
            properties:
              forProvider:
                description: |-
                  FeatureParameters are the configurable fields of a GrowthBook Feature.
                  The feature key is the resource's external name (crossplane.io/
                  external-name annotation), defaulting to metadata.name.

                  This milestone deliberately covers only the feature's value and its
                  per-environment enabled toggles. Rules, prerequisites, revisions, and
                  JSON schema validation are not modeled and are left for a later
                  milestone; a Feature managed here will report ResourceUpToDate based
                  solely on the fields below even if it also carries rules configured
                  out of band (for example through the GrowthBook UI).
                properties:
                  archived:
                    description: Archived hides the feature from the default feature
                      list.
                    type: boolean
                  defaultValue:
                    description: |-
                      DefaultValue is the value served when the feature is enabled. Its
                      type must match ValueType; for "number" and "json" the literal is
                      passed through as a string exactly as GrowthBook expects it.
                    type: string
                  description:
                    description: Description is free text shown in the GrowthBook
                      UI.
                    type: string
                  environments:
                    additionalProperties:
                      description: |-
                        FeatureEnvironment is the desired state of a Feature within one
                        environment.
                      properties:
                        enabled:
                          description: Enabled toggles the feature on or off in this
                            environment.
                          type: boolean
                      type: object
                    description: |-
                      Environments maps an environment id to its desired enabled state.
                      Only the environments present here are managed; environments left
                      out are never touched.
                    type: object
                  owner:
                    description: Owner is the userId or email address of the feature's
                      owner.
                    type: string
                  project:
                    description: Project restricts the feature to one project id.
                    type: string
                  tags:
                    description: |-
                      Tags are labels associated with the feature. Nil means unmanaged;
                      a set list compares and replaces as a set.
                    items:
                      type: string
                    type: array
                  valueType:
                    description: |-
                      ValueType is the data type of the feature payload. Immutable after
                      creation.
                    enum:
                    - boolean
                    - string
                    - number
                    - json
                    type: string
                required:
                - defaultValue
                - valueType
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A FeatureStatus represents the observed state of a Feature.
            properties:
              atProvider:
                description: FeatureObservation are the observable fields of a GrowthBook
                  Feature.
                properties:
                  dateCreated:
                    description: DateCreated is when GrowthBook created the feature.
                    type: string
                  dateUpdated:
                    description: DateUpdated is when GrowthBook last updated the feature.
                    type: string
                  environments:
                    additionalProperties:
                      description: |-
                        FeatureEnvironmentObservation is the observed state of a Feature within
                        one environment.
                      properties:
                        enabled:
                          description: Enabled reports whether the feature is on in
                            this environment.
                          type: boolean
                      type: object
                    description: Environments reports the observed enabled state per
                      environment.
                    type: object
                  id:
                    description: ID is the feature key as stored by GrowthBook.
                    type: string
                  revision:
                    description: Revision is the feature's current published revision.
                    properties:
                      version:
                        description: Version is the revision number.
                        type: integer
                    type: object
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
