---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sdkconnections.sdk.growthbook.crossplane.io
spec:
  group: sdk.growthbook.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - growthbook
    kind: SDKConnection
    listKind: SDKConnectionList
    plural: sdkconnections
    singular: sdkconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A SDKConnection is a GrowthBook SDK Connection: a client key an
          application uses to fetch feature flag and experiment definitions for one
          environment (and optionally a subset of projects). Applying this resource
          with spec.writeConnectionSecretToRef set writes the resulting client "key"
          (and, when the proxy is enabled, "proxySigningKey" and "proxyHost") into
          the referenced Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A SDKConnectionSpec defines the desired state of a SDKConnection.
            properties:
              forProvider:
                description: |-
                  SDKConnectionParameters are the configurable fields of a GrowthBook SDK
                  Connection. Every optional field is a pointer so that only fields the user
                  actually sets participate in drift detection; a nil pointer means
                  "unmanaged", not "false"/"empty".
                properties:
                  allowedCustomFieldsInMetadata:
                    description: |-
                      AllowedCustomFieldsInMetadata limits which custom fields are included
                      when IncludeCustomFieldsInMetadata is set.
                    items:
                      type: string
                    type: array
                  encryptPayload:
                    description: EncryptPayload enables payload encryption for this
                      connection.
                    type: boolean
                  environment:
                    description: |-
                      Environment is the id of the GrowthBook environment this connection
                      serves.
                    minLength: 1
                    type: string
                  hashSecureAttributes:
                    description: |-
                      HashSecureAttributes hashes secure attributes before they leave the
                      server.
                    type: boolean
                  includeCustomFieldsInMetadata:
                    description: |-
                      IncludeCustomFieldsInMetadata includes custom fields in feature
                      metadata.
                    type: boolean
                  includeDraftExperimentRefs:
                    description: |-
                      IncludeDraftExperimentRefs includes experiment-ref rules linked to
                      draft experiments in the SDK payload.
                    type: boolean
                  includeDraftExperiments:
                    description: |-
                      IncludeDraftExperiments includes draft (not yet running) experiments
                      in the SDK payload.
                    type: boolean
                  includeExperimentNames:
                    description: IncludeExperimentNames includes experiment names
                      in the SDK payload.
                    type: boolean
                  includeExperimentScheduleInMetadata:
                    description: |-
                      IncludeExperimentScheduleInMetadata includes experiment scheduling
                      info in feature metadata.
                    type: boolean
                  includeProjectIdInMetadata:
                    description: |-
                      IncludeProjectIdInMetadata includes the project id in feature
                      metadata.
                    type: boolean
                  includeRedirectExperiments:
                    description: |-
                      IncludeRedirectExperiments includes URL redirect experiments in the
                      SDK payload.
                    type: boolean
                  includeReferencedPrerequisites:
                    description: |-
                      IncludeReferencedPrerequisites carries prerequisite feature flags into
                      the payload even when they target other projects.
                    type: boolean
                  includeRuleIds:
                    description: IncludeRuleIds includes rule ids in the SDK payload.
                    type: boolean
                  includeTagsInMetadata:
                    description: IncludeTagsInMetadata includes tags in feature metadata.
                    type: boolean
                  includeVisualExperiments:
                    description: |-
                      IncludeVisualExperiments includes visual editor experiments in the
                      SDK payload.
                    type: boolean
                  language:
                    description: |-
                      Language is the SDK language/platform this connection targets, for
                      example "javascript", "react", "go", or "nodejs".
                    minLength: 1
                    type: string
                  name:
                    description: Name is the human-readable connection name.
                    minLength: 1
                    type: string
                  projects:
                    description: |-
                      Projects restricts the connection to the given project ids. A nil
                      value leaves project scoping unmanaged; an empty list clears it.
                    items:
                      type: string
                    type: array
                  proxyEnabled:
                    description: ProxyEnabled enables the GrowthBook proxy for this
                      connection.
                    type: boolean
                  proxyHost:
                    description: ProxyHost is the proxy host to use when ProxyEnabled
                      is true.
                    type: string
                  remoteEvalEnabled:
                    description: RemoteEvalEnabled enables remote evaluation for this
                      connection.
                    type: boolean
                  savedGroupReferencesEnabled:
                    description: |-
                      SavedGroupReferencesEnabled enables saved group references in the SDK
                      payload.
                    type: boolean
                  sdkVersion:
                    description: SDKVersion is the SDK version this connection targets.
                    type: string
                required:
                - environment
                - language
                - name
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A SDKConnectionStatus represents the observed state of a
              SDKConnection.
            properties:
              atProvider:
                description: |-
                  SDKConnectionObservation are the observable, non-secret fields of a
                  GrowthBook SDK Connection. The client key and proxy signing key are
                  secrets: they are only ever surfaced through connection details, never
                  written to status.
                properties:
                  connected:
                    description: |-
                      Connected reports whether GrowthBook has seen this connection make an
                      SDK request at least once.
                    type: boolean
                  dateCreated:
                    description: DateCreated is the RFC 3339 creation timestamp reported
                      by GrowthBook.
                    type: string
                  dateUpdated:
                    description: |-
                      DateUpdated is the RFC 3339 last-update timestamp reported by
                      GrowthBook.
                    type: string
                  id:
                    description: ID is the GrowthBook-assigned connection id ("sdk_...").
                    type: string
                  languages:
                    description: |-
                      Languages is the set of SDK languages GrowthBook reports for this
                      connection.
                    items:
                      type: string
                    type: array
                  organization:
                    description: |-
                      Organization is the GrowthBook organization id that owns the
                      connection.
                    type: string
                  project:
                    description: |-
                      Project is the first project GrowthBook associates with this
                      connection, kept for backwards compatibility with older API
                      responses. Prefer Projects on the spec.
                    type: string
                  sseEnabled:
                    description: |-
                      SSEEnabled reports whether server-sent events are enabled for this
                      connection.
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
