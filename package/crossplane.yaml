apiVersion: meta.pkg.crossplane.io/v1alpha1
kind: Provider
metadata:
  name: provider-growthbook
  annotations:
    meta.crossplane.io/maintainer: Johnzell Wilson <johnzellw89@gmail.com>
    meta.crossplane.io/source: github.com/jz-wilson/provider-growthbook
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A Crossplane provider for GrowthBook. Manages projects, environments,
      features, and SDK connections through the GrowthBook REST API.
    meta.crossplane.io/readme: |
      provider-growthbook is a native (non-Upjet) Crossplane v2 provider for
      the GrowthBook feature-flag and experimentation platform. Resources are
      namespaced managed resources; credentials come from a ProviderConfig
      secret holding {"apiKey": "...", "apiUrl": "..."}.
spec:
  capabilities:
    - safe-start
